<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=110, initial-scale=1">
  <title>Don&#39;t be a silly goose tile</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 110px;
      height: 110px;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    .goose-tile {
      overflow: hidden;
      position: relative;
      isolation: isolate;
      width: 110px;
      height: 110px;
      border: 2px solid transparent;
      border-radius: 0.375rem;
      background:
        radial-gradient(circle at 78% 22%, rgb(255 126 219 / 18%), transparent 42%),
        linear-gradient(145deg, #16132b 0%, #262335 52%, #1c1538 100%);
      box-shadow:
        inset 0 0 22px rgb(255 126 219 / 16%),
        0 0 14px rgb(54 249 246 / 12%);
    }

    .goose-tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 53% center;
      filter: grayscale(1) invert(1) contrast(1.5) brightness(0.78) sepia(1) saturate(9) hue-rotate(275deg) brightness(1.25);
      mix-blend-mode: lighten;
      position: relative;
      z-index: 1;
      padding: 0;
      border-radius: 0.375rem;
      clip-path: inset(15% 0 55% 0);
      transform: scale(1.6) translate(calc(-8% - 5px), 20%) scaleX(-1);
      transform-origin: center;
      animation: goose-flight 1400ms cubic-bezier(0.37, 0, 0.63, 1) infinite alternate;
      will-change: transform;
    }

    .goose-tile::before,
    .goose-tile::after {
      content: "";
      position: absolute;
      inset: 0 auto 0 -70%;
      width: 170%;
      z-index: 2;
      pointer-events: none;
      filter: blur(0.8px);
    }

    .goose-tile::before {
      background:
        radial-gradient(ellipse, rgb(54 249 246 / 55%) 0 16%, transparent 72%) 14px 16px / 58px 7px no-repeat,
        radial-gradient(ellipse, rgb(54 249 246 / 42%) 0 18%, transparent 74%) 94px 49px / 38px 5px no-repeat,
        radial-gradient(ellipse, rgb(54 249 246 / 48%) 0 15%, transparent 70%) 132px 81px / 70px 8px no-repeat;
      animation: goose-wisps-near 1800ms linear infinite;
    }

    .goose-tile::after {
      background:
        radial-gradient(ellipse, rgb(255 126 219 / 36%) 0 17%, transparent 72%) 54px 29px / 46px 6px no-repeat,
        radial-gradient(ellipse, rgb(255 126 219 / 30%) 0 14%, transparent 70%) 118px 65px / 64px 7px no-repeat,
        radial-gradient(ellipse, rgb(255 126 219 / 40%) 0 19%, transparent 76%) 8px 96px / 32px 5px no-repeat;
      animation: goose-wisps-far 2600ms linear -900ms infinite;
    }

    @keyframes goose-wisps-near {
      from { transform: translateX(-35%); }
      to { transform: translateX(100%); }
    }

    @keyframes goose-wisps-far {
      from { transform: translateX(-20%); }
      to { transform: translateX(100%); }
    }

    @keyframes goose-flight {
      from {
        transform: scale(1.6) translate(calc(-8% - 5px), 17%) scaleX(-1);
      }

      to {
        transform: scale(1.6) translate(calc(-8% - 5px), 23%) scaleX(-1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .goose-tile img,
      .goose-tile::before,
      .goose-tile::after {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div class="goose-tile" role="img" aria-label="Don&#39;t be a silly goose">
    <img
      src="https://images.pdimagearchive.org/collections/edward-lear-s-walk-on-a-windy-day-1860/11338798843_15b3be3f31_b.jpg"
      alt=""
    >
  </div>
</body>
</html>
